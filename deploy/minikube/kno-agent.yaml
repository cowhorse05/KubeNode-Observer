apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kno-agent
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kno-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kno-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kno-agent
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      containers:
        - name: agent
          image: kubenode-observer/kno-agent:dev
          imagePullPolicy: IfNotPresent
          args:
            - --listen=:18080
          securityContext:
            privileged: true
            runAsUser: 0
          ports:
            - name: health
              containerPort: 18080
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
      volumes:
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: kno-agent
  namespace: kube-system
spec:
  selector:
    app.kubernetes.io/name: kno-agent
  ports:
    - name: health
      port: 18080
      targetPort: health

