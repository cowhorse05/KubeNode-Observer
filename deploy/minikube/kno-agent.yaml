apiVersion: v1
kind: ServiceAccount
metadata:
  name: kno-agent
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kno-agent
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kno-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kno-agent
subjects:
  - kind: ServiceAccount
    name: kno-agent
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kno-agent
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kno-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kno-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kno-agent
    spec:
      serviceAccountName: kno-agent
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      containers:
        - name: agent
          image: kubenode-observer/kno-agent:dev
          imagePullPolicy: IfNotPresent
          args:
            - --listen=:18080
            - --runtime-endpoint=unix:///run/containerd/containerd.sock
            - --host-proc=/host/proc
            - --cgroup-root=/host/sys/fs/cgroup
            - --topology-interval=5s
            - --cpu-interval=1s
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
            runAsUser: 0
          ports:
            - name: health
              containerPort: 18080
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
            - name: containerd-socket
              mountPath: /run/containerd/containerd.sock
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-cgroup
              mountPath: /host/sys/fs/cgroup
              readOnly: true
      volumes:
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
        - name: containerd-socket
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: host-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: kno-agent
  namespace: kube-system
spec:
  selector:
    app.kubernetes.io/name: kno-agent
  ports:
    - name: health
      port: 18080
      targetPort: health

