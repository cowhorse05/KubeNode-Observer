apiVersion: v1
kind: Pod
metadata:
  name: kno-host-contention
  namespace: kno-kata-test
spec:
  restartPolicy: Never
  containers:
    - name: cpu
      image: kubenode-observer/cpu-hog:dev
      imagePullPolicy: Never
      args: ["--duration=90s", "--workers=4"]
      resources:
        requests: {cpu: 100m, memory: 32Mi}
        limits: {cpu: "2", memory: 128Mi}
