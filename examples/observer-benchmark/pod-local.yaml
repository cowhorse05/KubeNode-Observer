apiVersion: v1
kind: Pod
metadata:
  name: kno-observer-benchmark
  namespace: default
  labels:
    app.kubernetes.io/name: kno-observer-benchmark
spec:
  restartPolicy: Never
  containers:
    - name: benchmark
      image: kubenode-observer/observer-benchmark:dev
      imagePullPolicy: Never
      args:
        - --duration=8s
        - --workers=8
        - --work-iterations=64
      resources:
        requests:
          cpu: "1"
          memory: 16Mi
        limits:
          cpu: "1"
          memory: 32Mi
