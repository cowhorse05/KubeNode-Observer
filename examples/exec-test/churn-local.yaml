apiVersion: v1
kind: Pod
metadata:
  name: kno-process-churn-local
  namespace: default
  labels:
    app.kubernetes.io/name: kno-process-churn-local
spec:
  restartPolicy: Never
  containers:
    - name: workload
      image: kubenode-observer/exec-test:dev
      imagePullPolicy: Never
      args:
        - --iterations=20000
        - --interval=0s
        - --child-exit-code=0
      resources:
        requests:
          cpu: 100m
          memory: 8Mi
        limits:
          cpu: "1"
          memory: 32Mi
