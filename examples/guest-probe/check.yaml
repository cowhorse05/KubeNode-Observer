apiVersion: v1
kind: Pod
metadata:
  name: kno-guest-check
  namespace: kno-guest-test
spec:
  runtimeClassName: kno-kata-qemu-guest
  shareProcessNamespace: true
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: probe
      image: kubenode-observer/guest-probe:dev
      imagePullPolicy: Never
      args: ["--check"]
      securityContext:
        privileged: true
      resources:
        requests: {cpu: 100m, memory: 64Mi}
        limits: {cpu: 500m, memory: 128Mi}
