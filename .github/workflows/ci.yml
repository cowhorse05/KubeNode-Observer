name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: Test
        run: go test ./...
      - name: Experiment summary tests
        run: python3 -m unittest discover -s hack -p '*_test.py'
      - name: Build
        run: make build
