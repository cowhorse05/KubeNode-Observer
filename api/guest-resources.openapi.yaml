openapi: 3.1.0
info:
  title: KubeNode-Observer Guest process windows (experimental M9)
  version: 0.3.0-experimental
  description: >-
    Guest CPU/runqlat, never Host accounting. The same read-only operation is
    served by the Pod-side Probe and an opt-in Node relay. Direct Probe responses
    have no sandboxId; only the relay adds the verified current CRI Sandbox ID.
    Trusted research cluster only: no TLS/auth or cryptographic Guest attestation.
paths:
  /api/v1/guest/resources:
    get:
      operationId: measureGuestProcesses
      description: >-
        At the Node endpoint sandbox is mandatory (full lowercase 64 hex). Relay
        resolves only an explicitly opted-in, current verified Kata Pod IP at a
        configured fixed port, never a URL supplied by the caller. Identity is
        checked before/after the window, with a fresh request nonce. Probe Pod UID
        comes from Downward API and must match current Kubernetes/CRI identity.
        No Host/Guest clock alignment is claimed. Procfs visibility is limited to
        the shared Pod PID namespace; process rows require stable starttime,
        thread set, unique namespace aliases and cgroup/global-key continuity.
        Missing/evicted/reset counters are null + issues, not inferred zero.
        Bounded to 256 visible processes, 512 threads per process, one concurrent
        window per Probe/relay, response <=2MiB. Selection limit truncates only
        after measurement/sorting. No complete Pod CPU total is inferred.
      parameters:
        - {name: sandbox, in: query, description: Required only at Node relay; rejected by direct Probe., schema: {type: string, pattern: '^[0-9a-f]{64}$'}}
        - {name: duration, in: query, schema: {type: string, default: 5s}, description: '100ms..10s'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: comm, in: query, description: Exact process comm filter (<=15 bytes)., schema: {type: string, maxLength: 15}}
        - name: timing
          in: query
          description: >-
            Only literal true/false accepted; default false omits timing entirely.
            True requires native monotonic brackets and stable boot/time namespace
            around all four map snapshot calls, even for an empty process result.
            No BPF event timestamps, atomic snapshot, or Host/Guest mapping implied.
            Clock failure/change fails the direct window with 503; missing or
            malformed upstream timing fails relay validation with 502.
          schema: {type: boolean, default: false}
        - name: X-Kno-Request-ID
          in: header
          description: Optional on direct Probe; generated by relay, echoed by Probe. Correlation only, not authentication.
          schema: {type: string, pattern: '^[0-9a-f]{32}$'}
      responses:
        '200':
          description: >-
            domain=guest; podUid, kernelRelease, bootId, instanceId, requestId,
            startedAt (Guest wall clock), actual durationSeconds and processes.
            Relay adds sandboxId/namespace/podName without rewriting measurements.
            CPU percentages normalize to one Guest logical CPU, can exceed 100%.
            P50/P95/P99 are microsecond log2 bucket upper bounds, not precise
            percentiles. runqlatCoverage counts included/window-start threads;
            a subset histogram is partial and is not the full process distribution.
            Null runqlat is unobserved, count=0 is observed zero only for covered threads.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Response'}
        '400':
          description: Invalid/repeated/unknown query or invalid request nonce.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: invalid_query, message: 'duration must be 100ms..10s'}
        '404':
          description: Sandbox no longer exists on this Node (relay).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '405':
          description: Only GET supported; Allow header is GET.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Pod/Sandbox/Probe identity changed or contradicted the response (relay).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: Another window is active; Retry-After header is 1 second.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: measurement_busy, message: another Guest relay window is active}
        '502':
          description: Probe unreachable, wrong content/status (including upstream 503), malformed/oversized response or redirect (relay).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Disabled/not opted in, stale topology, missing capability, invalid target or scan failed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '504':
          description: Probe request exceeded bounded timeout (relay).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
components:
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string, enum: [invalid_query, method_not_allowed, measurement_busy, measurement_unavailable, guest_unavailable, guest_upstream_failed, guest_identity_changed]}
        message: {type: string, minLength: 1}
    CPU:
      type: [object, 'null']
      required: [runtimeNs, percent, windowSeconds]
      properties:
        runtimeNs: {type: integer, minimum: 0}
        percent: {type: number, minimum: 0}
        windowSeconds: {type: number, exclusiveMinimum: 0}
    Latency:
      type: [object, 'null']
      required: [count, averageUs, p50Us, p95Us, p99Us, maxUs]
      properties:
        count: {type: integer, minimum: 0}
        averageUs: {type: number, minimum: 0}
        p50Us: {type: integer, minimum: 0}
        p95Us: {type: integer, minimum: 0}
        p99Us: {type: integer, minimum: 0}
        maxUs: {type: integer, minimum: 0}
        buckets:
          type: array
          maxItems: 64
          items:
            type: object
            required: [lowerUs, upperUs, count]
            properties:
              lowerUs: {type: integer, minimum: 0}
              upperUs: {type: integer, minimum: 0}
              count: {type: integer, minimum: 0}
    Process:
      type: object
      required: [namespacePid, startTimeTicks, command, cpu, runqlat, runqlatCoverage, partial]
      properties:
        namespacePid: {type: integer, minimum: 1}
        pid: {type: integer, minimum: 1, description: Guest kernel TGID, not Host PID.}
        cgroupId: {type: integer, minimum: 1, description: Guest cgroup domain, never join to Host inode.}
        startTimeTicks: {type: integer, minimum: 1}
        command: {type: string}
        cpu: {$ref: '#/components/schemas/CPU'}
        runqlat: {$ref: '#/components/schemas/Latency'}
        runqlatCoverage:
          type: object
          required: [observedThreads, totalThreads]
          properties:
            observedThreads: {type: integer, minimum: 0, maximum: 512}
            totalThreads: {type: integer, minimum: 0, maximum: 512}
        partial: {type: boolean}
        issues: {type: array, items: {type: string}}
    Response:
      type: object
      required: [domain, podUid, kernelRelease, bootId, instanceId, requestId, startedAt, durationSeconds, totalItems, processes]
      properties:
        domain: {type: string, const: guest}
        podUid: {type: string, minLength: 1}
        namespace: {type: string}
        podName: {type: string}
        sandboxId: {type: string, pattern: '^[0-9a-f]{64}$'}
        kernelRelease: {type: string, minLength: 1}
        bootId: {type: string, format: uuid}
        instanceId: {type: string, pattern: '^[0-9a-f]{32}$'}
        requestId: {type: string, pattern: '^[0-9a-f]{32}$'}
        startedAt: {type: string, format: date-time}
        durationSeconds: {type: number, minimum: 0}
        timing: {$ref: './window-timing.schema.json'}
        totalItems: {type: integer, minimum: 0, maximum: 256}
        processes: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Process'}}
